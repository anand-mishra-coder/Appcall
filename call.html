<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>CallWeb — Call</title>

    <link
        rel="stylesheet"
        href="css/call.css"
    >

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- =====================================================
         CALL APP
         ===================================================== -->

    <main class="call-app">


        <!-- =================================================
             INCOMING CALL
             ================================================= -->

        <section
            id="incomingCallModal"
            class="call-screen incoming-screen"
            hidden
        >

            <div class="incoming-content">

                <div class="caller-avatar">
                    <span id="incomingAvatar">U</span>
                </div>

                <p class="call-label">
                    Incoming Call
                </p>

                <h1 id="incomingCallerName">
                    User
                </h1>

                <p
                    id="incomingCallType"
                    class="call-type"
                >
                    Incoming audio call
                </p>


                <div class="incoming-actions">

                    <button
                        id="rejectCallButton"
                        class="call-action reject"
                        type="button"
                        aria-label="Reject call"
                    >
                        <i data-lucide="phone-off"></i>
                    </button>


                    <button
                        id="acceptCallButton"
                        class="call-action accept"
                        type="button"
                        aria-label="Accept call"
                    >
                        <i data-lucide="phone"></i>
                    </button>

                </div>

            </div>

        </section>



        <!-- =================================================
             OUTGOING CALL
             ================================================= -->

        <section
            id="outgoingCallModal"
            class="call-screen outgoing-screen"
            hidden
        >

            <div class="outgoing-content">

                <div class="caller-avatar pulse">
                    <span id="outgoingAvatar">U</span>
                </div>

                <p class="call-label">
                    Calling
                </p>

                <h1 id="outgoingCallerName">
                    User
                </h1>

                <p
                    id="outgoingCallType"
                    class="call-type"
                >
                    Calling...
                </p>

                <div class="calling-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>


                <button
                    id="cancelCallButton"
                    class="end-call-button"
                    type="button"
                >
                    <i data-lucide="phone-off"></i>

                    <span>
                        Cancel
                    </span>
                </button>

            </div>

        </section>



        <!-- =================================================
             ACTIVE CALL
             ================================================= -->

        <section
            id="activeCallModal"
            class="call-screen active-screen"
            hidden
        >


            <!-- ---------------------------------------------
                 Remote Video
                 --------------------------------------------- -->

            <div class="remote-video-container">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                ></video>


                <div
                    id="remotePlaceholder"
                    class="remote-placeholder"
                >

                    <div class="large-avatar">
                        <span id="activeCallerAvatar">
                            U
                        </span>
                    </div>

                    <h2 id="callerName">
                        User
                    </h2>

                    <p id="callStatus">
                        Connecting...
                    </p>

                </div>

            </div>



            <!-- ---------------------------------------------
                 Local Video
                 --------------------------------------------- -->

            <div
                id="localVideoContainer"
                class="local-video-container"
            >

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>

            </div>



            <!-- ---------------------------------------------
                 Top Bar
                 --------------------------------------------- -->

            <header class="call-topbar">

                <div class="call-user-info">

                    <div class="mini-avatar">
                        <span id="topCallerAvatar">
                            U
                        </span>
                    </div>

                    <div>

                        <strong id="topCallerName">
                            User
                        </strong>

                        <small id="topCallStatus">
                            Connected
                        </small>

                    </div>

                </div>

            </header>



            <!-- ---------------------------------------------
                 Audio Element
                 --------------------------------------------- -->

            <audio
                id="localAudio"
                autoplay
            ></audio>



            <!-- ---------------------------------------------
                 Call Controls
                 --------------------------------------------- -->

            <div class="call-controls">


                <!-- Mute -->

                <button
                    id="muteButton"
                    class="control-button"
                    type="button"
                    aria-label="Mute microphone"
                    title="Mute"
                >

                    <i data-lucide="mic"></i>

                </button>



                <!-- Camera -->

                <button
                    id="cameraButton"
                    class="control-button"
                    type="button"
                    aria-label="Turn camera off"
                    title="Camera"
                >

                    <i data-lucide="video"></i>

                </button>



                <!-- Speaker -->

                <button
                    id="speakerButton"
                    class="control-button"
                    type="button"
                    aria-label="Speaker"
                    title="Speaker"
                >

                    <i data-lucide="volume-2"></i>

                </button>



                <!-- End Call -->

                <button
                    id="endCallButton"
                    class="control-button end"
                    type="button"
                    aria-label="End call"
                    title="End Call"
                >

                    <i data-lucide="phone-off"></i>

                </button>

            </div>

        </section>



        <!-- =================================================
             GENERAL CALL MODAL
             ================================================= -->

        <section
            id="callModal"
            class="call-screen"
            hidden
        >

            <div class="call-error-box">

                <div class="error-icon">

                    <i data-lucide="phone-off"></i>

                </div>

                <h2>
                    Call Error
                </h2>

                <p id="callErrorMessage">
                    Unable to connect the call.
                </p>

                <button
                    id="closeCallErrorButton"
                    type="button"
                    class="secondary-action"
                >
                    Close
                </button>

            </div>

        </section>

    </main>



    <!-- =====================================================
         FIREBASE
         ===================================================== -->

    <script
        type="module"
        src="js/firebase.js"
    ></script>



    <!-- =====================================================
         WEBRTC
         ===================================================== -->

    <script
        type="module"
        src="js/webrtc.js"
    ></script>



    <!-- =====================================================
         ICONS
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                if (window.lucide) {
                    window.lucide.createIcons();
                }

            }
        );

    </script>

</body>

</html>
